<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iPhone Safari from zooming in on small text fields; a page left zoomed in makes the fixed tab bar and floating buttons drift with the scroll. Pinch zoom still works on iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>My Coffee Diary</title>
    <link rel="icon" type="image/png" href="/coffee-diary-icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/coffee-diary-icon-180.png" />
    <meta name="theme-color" content="#7a5733" />
    <script>
      // Apply the saved light/dark choice before the first paint so the page never flashes the wrong theme.
      try {
        var t = localStorage.getItem("coffee-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#1a1713");
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
