<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iPhone Safari from zooming in on small text fields; a page left zoomed in makes the fixed tab bar and floating buttons drift with the scroll. Pinch zoom still works on iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>My Coffee Diary</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/coffee-diary-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/coffee-diary-favicon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/coffee-diary-icon-180.png" />
    <meta name="theme-color" content="#7a5733" />
    <script>
      // Apply the saved light/dark and colour choices before the first paint so the page never flashes the wrong theme.
      // Bar colours match BAR_COLORS in src/data/theme.ts.
      try {
        var t = localStorage.getItem("coffee-theme");
        var c = localStorage.getItem("coffee-color");
        var bars = { coffee: ["#7a5733", "#1a1713"], earlgrey: ["#45627f", "#15181b"], espresso: ["#665d55", "#181717"] };
        if (!bars[c]) c = "coffee";
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (c !== "coffee") document.documentElement.dataset.color = c;
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", bars[c][dark ? 1 : 0]);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
